<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101714"><title>ひと箱の記録</title>
<style>
:root{color-scheme:dark;--bg:#101714;--panel:#18211d;--line:#2c3932;--muted:#a8b5ac;--cream:#f0eee5;--green:#b6d9b1;--orange:#e4a16d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 5%,#26392e 0,transparent 38%),var(--bg);color:var(--cream);font:16px/1.65 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:1050px;margin:auto;padding:40px 22px 68px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--green);text-transform:uppercase}h1{font-size:clamp(34px,6vw,58px);line-height:1.1;letter-spacing:-.05em;margin:10px 0 12px}.intro{color:var(--muted);max-width:620px;margin:0 0 30px}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.card{background:linear-gradient(145deg,#1c2721,#151d19);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 50px #0002}.card h2{font-size:18px;margin:0 0 16px}.label{display:block;font-size:13px;color:#c4cec6;margin:15px 0 7px}input{width:100%;border:1px solid #405047;border-radius:10px;background:#101713;color:var(--cream);padding:12px 13px;font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #b6d9b122}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;background:var(--green);color:#152118;font-weight:750;font-size:15px;padding:12px 17px;cursor:pointer;margin-top:17px}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:#28352d;color:var(--cream);border:1px solid #46564b;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.stat{background:#101713;border:1px solid #28362e;border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:20px;margin-top:3px}.lung-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:405px;position:relative;overflow:hidden}.lung-card h2{align-self:flex-start}.lungs{width:min(245px,78%);height:250px;filter:grayscale(var(--gray,0)) brightness(var(--bright,1));transition:filter .8s ease}.lung-caption{margin:0;color:var(--muted);font-size:13px;text-align:center}.level{font-size:13px;color:var(--green);margin:10px 0 0}.history{margin-top:18px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-list{margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #2b3730;padding:12px 1px}.item span{font-size:14px}.item small{color:var(--muted);display:block}.delete{border:1px solid #435047;background:transparent;color:#cbd5cc;border-radius:8px;padding:6px 9px;cursor:pointer}.empty{color:var(--muted);font-size:14px;padding:12px 0}.note{font-size:12px;color:#91a096;margin-top:22px}.note strong{color:#d2d9d3}.toast{min-height:20px;color:var(--orange);font-size:13px;margin-top:9px}@media(max-width:760px){main{padding:28px 15px 50px}.layout{grid-template-columns:1fr}.lung-card{min-height:360px}.stats{gap:7px}.stat{padding:10px 8px}.stat strong{font-size:17px}.card{padding:19px}}
</style></head>
<body><main>
<div class="eyebrow">A small record, a clearer view</div><h1>ひと箱の記録</h1><p class="intro">買った本数と金額を、ひとつずつ記録。積み重なった数字を見える形にします。</p>
<div class="layout"><section class="card"><h2>最初の設定</h2><label class="label" for="price">タバコ一箱の値段（円）</label><input id="price" type="number" min="0" step="1" placeholder="例：600">
<label class="label" for="years">喫煙年数（年）</label><input id="years" type="number" min="0" step="0.5" placeholder="例：5"><label class="label" for="monthlyPacks">一ヶ月に吸う箱数</label><input id="monthlyPacks" type="number" min="0" step="1" placeholder="例：20">
<button class="btn" id="saveSettings">設定を保存</button><div class="toast" id="toast" aria-live="polite"></div>
<div class="stats"><div class="stat"><small>購入した箱数</small><strong id="totalPacks">0 箱</strong></div><div class="stat"><small>購入合計金額</small><strong id="totalCost">¥0</strong></div><div class="stat"><small>設定した喫煙年数</small><strong id="yearsDisplay">—</strong></div></div>
<div class="history"><div class="history-head"><h2 style="margin:20px 0 0">購入を記録</h2></div><div class="row"><div><label class="label" for="date">購入日</label><input id="date" type="date"></div><div><label class="label" for="packs">箱数</label><input id="packs" type="number" min="1" step="1" value="1"></div></div><button class="btn" id="addPurchase">＋ 購入を追加</button><div class="history-head"><h2 style="margin:24px 0 0">記録一覧</h2></div><div class="history-list" id="history"></div></div>
</section>
<section class="card lung-card"><h2>肺のイメージ</h2><svg class="lungs" viewBox="0 0 240 250" role="img" aria-label="喫煙記録に応じた肺のイメージ"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0a28b"/><stop offset="1" stop-color="#c96458"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation=".6"/></filter></defs><path d="M112 27 Q120 21 128 27 L128 106 Q128 122 120 128 Q112 122 112 106Z" fill="#e9d3b9"/><path d="M113 62 L89 99 M127 62 L151 99 M112 79 L98 103 M128 79 L142 103" fill="none" stroke="#e9d3b9" stroke-width="7" stroke-linecap="round"/><path d="M101 74 C83 74 69 91 61 111 C50 139 48 175 59 195 C69 213 91 210 103 196 C114 183 114 156 114 131 L114 88 C114 79 109 74 101 74Z" fill="url(#t)"/><path d="M139 74 C157 74 171 91 179 111 C190 139 192 175 181 195 C171 213 149 210 137 196 C126 183 126 156 126 131 L126 88 C126 79 131 74 139 74Z" fill="url(#t)"/><path d="M65 148 Q88 128 110 148 M130 148 Q152 128 175 148 M66 169 Q89 150 110 169 M130 169 Q151 150 174 169" fill="none" stroke="#f4baa0" stroke-width="3" opacity=".52"/><path id="soot" d="M65 118 C82 99 95 117 109 109 L112 176 C101 201 80 207 65 192 C55 178 57 143 65 118Z M175 118 C158 99 145 117 131 109 L128 176 C139 201 160 207 175 192 C185 178 183 143 175 118Z" fill="#202622" opacity=".02" filter="url(#soft)"/></svg><p class="lung-caption">喫煙年数・月の箱数・購入記録をもとにした、変化のイメージ</p><p class="level" id="level">記録を始めましょう</p></section></div>
<p class="note"><strong>大切なお知らせ：</strong>肺の画像は設定した喫煙年数と月の箱数、購入記録に連動する演出で、実際の肺の色や健康状態を示すものではありません。喫煙年数や本数から肺の状態を判定することはできません。</p>
</main><script>
const KEY='hitohako-v1';const $=id=>document.getElementById(id);let data={price:'',years:'',monthlyPacks:'',purchases:[]};try{data={...data,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');$('price').value=data.price||'';$('years').value=data.years||'';$('monthlyPacks').value=data.monthlyPacks??'';
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){let boxes=data.purchases.reduce((a,p)=>a+p.packs,0),cost=boxes*Number(data.price||0);$('totalPacks').textContent=boxes+' 箱';$('totalCost').textContent=yen(cost);$('yearsDisplay').textContent=data.years?data.years+' 年':'—';let years=Number(data.years)||0,monthlyPacks=Number(data.monthlyPacks)||0;let darkness=Math.min(.78, years*monthlyPacks*12*.00035+boxes*.012);document.documentElement.style.setProperty('--gray',Math.min(.75,darkness).toFixed(2));document.documentElement.style.setProperty('--bright',(1-darkness*.48).toFixed(2));$('soot').setAttribute('opacity',Math.min(.78,darkness).toFixed(2));$('level').textContent=boxes?`記録 ${boxes} 箱 ・ イメージ変化 ${Math.round(darkness/.78*100)}%`:(years?`喫煙年数 ${years} 年を設定しました`:'記録を始めましょう');let h=$('history');if(!data.purchases.length){h.innerHTML='<div class="empty">まだ購入記録はありません。</div>';return}h.innerHTML=[...data.purchases].reverse().map(p=>`<div class="item"><span><strong>${esc(p.date)}</strong><small>${p.packs} 箱 · ${yen(p.packs*Number(data.price||0))}</small></span><button class="delete" data-id="${esc(p.id)}" aria-label="記録を削除">削除</button></div>`).join('');h.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{data.purchases=data.purchases.filter(p=>p.id!==b.dataset.id);save();render()})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('saveSettings').onclick=()=>{let p=Number($('price').value),y=Number($('years').value),m=Number($('monthlyPacks').value);if(!p||p<1||$('years').value===''||y<0||$('monthlyPacks').value===''||m<0){$('toast').textContent='一箱の値段と喫煙年数を入力してください。';return}data.price=p;data.years=y;data.monthlyPacks=m;save();$('toast').textContent='設定を保存しました。';render()};$('addPurchase').onclick=()=>{let n=Number($('packs').value);if(!data.price){$('toast').textContent='先に一箱の値段を設定してください。';$('price').focus();return}if(!n||n<1){$('toast').textContent='箱数を1以上で入力してください。';return}data.purchases.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$('date').value||today.toISOString().slice(0,10),packs:Math.floor(n)});save();$('toast').textContent='購入を記録しました。';render()};render();
</script></body></html>
